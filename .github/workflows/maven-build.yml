# This workflow builds the library and runs its tests with Maven on every push and pull request
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # domain-repository3 and dao4 come from the GitHub Packages registries of their repositories

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # one server entry for each repositories/repository and distributionManagement/repository id of the pom.xml
    # (setup-java can only write one)
    - name: Write Maven settings
      run: |
        cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
        <settings>
          <servers>
            <server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            <server><id>github-domain-repository</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            <server><id>github-dao</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
          </servers>
        </settings>
        EOF

    # compiles against the Java 8 API and runs all tests
    - name: Build and test with Maven
      run: mvn -B -ntp verify -s "$RUNNER_TEMP/settings.xml"
      env:
        GITHUB_TOKEN: ${{ github.token }}
