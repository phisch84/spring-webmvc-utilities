# This workflow will build a package using Maven and then publish it to GitHub packages when a release is published
# ("published", not "created": saving a draft release must not publish anything)
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publishes this library; also reads domain-repository3 and dao4 from the registries of their repositories

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # one server entry for each repositories/repository and distributionManagement/repository id of the pom.xml
    # (setup-java can only write one)
    - name: Write Maven settings
      run: |
        cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
        <settings>
          <servers>
            <server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            <server><id>github-domain-repository</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            <server><id>github-dao</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
          </servers>
        </settings>
        EOF

    # builds and tests the library before deploying it (deploy runs all earlier phases, including the tests)
    - name: Build and publish to GitHub Packages Apache Maven
      run: mvn -B -ntp deploy -s "$RUNNER_TEMP/settings.xml"
      env:
        GITHUB_TOKEN: ${{ github.token }}
